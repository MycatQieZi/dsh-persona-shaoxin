        order: 1
        maxChars: 24000
        watch: true
        files:
          - SOUL.md
          - IDENTITY.md
          - USER.md
          - LINES.md      # 台词库，烧心体的句式引擎在这
          - MEMORY.md
          - TOOLS.md
